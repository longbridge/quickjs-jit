[package]
name = "rquickjs-jit"
version = "0.12.2"
authors = ["Mees Delzenne <mees.delzenne@gmail.com>", "K. <kayo@illumium.org>"]
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Optional tiered JIT runtime for rquickjs"
repository = "https://github.com/DelSkayn/rquickjs.git"
build = "build.rs"

[build-dependencies]
rquickjs-sys = { path = "../sys", features = ["jit-abi"] }

[dependencies]
rquickjs-core = { path = "../core", features = ["jit-abi", "loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[target.'cfg(all(target_endian = "little", any(target_os = "linux", target_os = "macos"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
libc = "0.2"

[target.'cfg(all(target_endian = "little", target_os = "windows", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cranelift-codegen = { version = "0.116", optional = true, features = ["x86", "arm64", "enable-serde"] }
cranelift-frontend = { version = "0.116", optional = true }
cranelift-module = { version = "0.116", optional = true }
cranelift-object = { version = "0.116", optional = true }
cranelift-native = { version = "0.116", optional = true }
gimli = { version = "0.31", optional = true, default-features = false, features = ["write", "std"] }
postcard = { version = "1", optional = true, default-features = false, features = ["alloc"] }
target-lexicon = { version = "0.13", optional = true }

[dev-dependencies]
criterion = "0.5"
rquickjs = { path = "..", features = ["jit-abi", "loader"] }
static_assertions = "1"
trybuild = "1"

[[bin]]
name = "jit-test262"
required-features = ["test-support"]

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "algorithms"
harness = false

[[bench]]
name = "tiering"
harness = false

[features]
default = []
bindgen = ["rquickjs-core/bindgen"]
parallel = ["rquickjs-core/parallel", "rquickjs/parallel"]
compiler = [
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-module",
  "dep:cranelift-object",
  "dep:cranelift-native",
  "dep:gimli",
  "dep:postcard",
  "dep:target-lexicon",
]
test-support = ["rquickjs-core/jit-test-support"]

[[test]]
name = "helpers"
required-features = ["compiler", "test-support"]

[[test]]
name = "semantics"
required-features = ["compiler", "test-support"]

[[test]]
name = "gpui_shell_surface"
required-features = ["compiler", "test-support"]

[[test]]
name = "opcodes"
required-features = ["compiler", "test-support"]

[[test]]
name = "differential"
required-features = ["compiler", "test-support"]

[[test]]
name = "optimized"
required-features = ["compiler", "test-support"]

[[test]]
name = "deopt"
required-features = ["compiler", "test-support"]

[[test]]
name = "background"
required-features = ["test-support"]

[[test]]
name = "osr"
required-features = ["compiler", "test-support"]

[[test]]
name = "test262"
required-features = ["compiler", "test-support"]
