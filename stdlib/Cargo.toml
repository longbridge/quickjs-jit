[package]
name = "quickjs-jit-stdlib"
version = "0.12.7"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "LLRT-derived standard modules for quickjs-jit in one distributable crate"
repository = "https://github.com/longbridge/quickjs-jit"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "LICENSE-APACHE", "NOTICE", "NOTICE-LLRT", "UPSTREAM.json", "Cargo.toml"]

[features]
parallel = ["rquickjs/parallel"]

[dependencies]
aes = { version = "0.9" }
aes-gcm = { version = "0.11", features = ["alloc", "hazmat"], default-features = false }
aes-kw = { version = "0.3", features = ["oid"], default-features = false }
base64-simd = { version = "0.8", features = ["alloc"], default-features = false }
brotli = { version = "8", features = ["std"], default-features = false }
cbc = { version = "0.2", features = ["alloc"] }
const-oid = { version = "0.10", features = ["db"], default-features = false }
crc32c = { version = "0.6", default-features = false }
crc32fast = { version = "1", default-features = false }
ctr = { version = "0.10", default-features = false }
der = { version = "0.8", features = ["alloc", "derive"], default-features = false }
ecdsa = { version = "0.17", default-features = false }
ed25519-dalek = { version = "3.0.0-rc.1", features = ["alloc", "pkcs8", "rand_core"], default-features = false }
elliptic-curve = { version = "0.14", features = ["alloc", "sec1"], default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
half = { version = "2", default-features = false }
hex-simd = { version = "0.8", features = ["alloc"], default-features = false }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
itoa = { version = "1", default-features = false }
md-5 = { version = "0.11", default-features = false }
memchr = { version = "2", default-features = false, features = ["std"] }
once_cell = { version = "1", features = ["std"], default-features = false }
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"], default-features = false }
p384 = { version = "0.14.0-rc.15", features = ["ecdh", "ecdsa", "pkcs8"], default-features = false }
p521 = { version = "0.14.0-rc.15", features = ["ecdh", "ecdsa", "pkcs8"], default-features = false }
pbkdf2 = { version = "0.13", default-features = false }
phf = { version = "0.14", features = ["macros"], default-features = false }
pkcs8 = { version = "0.11", default-features = false, features = ["alloc"] }
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"], default-features = false }
rquickjs = { version = "=0.12.7", features = ["futures", "half", "loader", "macro", "std"], default-features = false, package = "quickjs-jit", path = ".." }
rsa = { version = "0.10.0-rc.18", features = ["encoding", "sha2", "std"], default-features = false }
ryu = { version = "1", default-features = false }
sha1 = { version = "0.11", features = ["oid"], default-features = false }
simd-json = { version = "0.18", features = ["big-int-as-float"], default-features = false }
simdutf8 = { version = "0.1", default-features = false, features = ["aarch64_neon", "std"] }
spki = { version = "0.8", features = ["alloc"], default-features = false }
tokio = { version = "1", features = ["macros", "sync", "time"], default-features = false }
tracing = { version = "0.1", default-features = false }
url = { version = "2", features = ["std"], default-features = false }
x25519-dalek = { version = "3.0.0-rc.1", features = ["static_secrets", "zeroize"], default-features = false }
zstd = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
memchr = { version = "2", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"], default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_nightly)"] }
