name: Stdlib
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test -p quickjs-jit-stdlib
      - run: cargo test -p quickjs-jit-stdlib --all-features

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify the redistributed package and local binding releases
        run: cargo package -p quickjs-jit-sys -p quickjs-jit-core -p quickjs-jit-macro -p quickjs-jit -p quickjs-jit-stdlib
      - name: Check published dependency boundary
        run: python3 scripts/check-stdlib-package.py target/package/quickjs-jit-stdlib-*.crate

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.89.0'
      - run: cargo check -p quickjs-jit-stdlib
